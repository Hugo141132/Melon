# Kebun Melon Development MQTT Broker Topic Access Control List (ACL)
# Authoritative Spec: docs/DEVICE_COMMUNICATION.md §8 & §31

# ==============================================================================
# IoT Gateway Service Access
# Gateway requires full read/write access across all agriculture topics
# ==============================================================================
user gateway_user
topic readwrite agriculture/#

# ==============================================================================
# Specific Development Devices (Strictly isolated per device ID)
# ==============================================================================

# Device 1: device_esp32_001
user device_esp32_001
topic write agriculture/+/+/device_esp32_001/telemetry/#
topic write agriculture/+/+/device_esp32_001/status
topic write agriculture/+/+/device_esp32_001/heartbeat
topic write agriculture/+/+/device_esp32_001/ack/#
topic write agriculture/+/+/device_esp32_001/event/#
topic read agriculture/+/+/device_esp32_001/command/#
topic read agriculture/+/+/device_esp32_001/config/#

# Device 2: device_node_002
user device_node_002
topic write agriculture/+/+/device_node_002/telemetry/#
topic write agriculture/+/+/device_node_002/status
topic write agriculture/+/+/device_node_002/heartbeat
topic write agriculture/+/+/device_node_002/ack/#
topic write agriculture/+/+/device_node_002/event/#
topic read agriculture/+/+/device_node_002/command/#
topic read agriculture/+/+/device_node_002/config/#

# Test Device for ACL Denial Testing: unauthorized_device
user unauthorized_device
topic write agriculture/+/+/unauthorized_device/telemetry/#
topic write agriculture/+/+/unauthorized_device/status
topic write agriculture/+/+/unauthorized_device/heartbeat
topic write agriculture/+/+/unauthorized_device/ack/#
topic write agriculture/+/+/unauthorized_device/event/#
topic read agriculture/+/+/unauthorized_device/command/#
topic read agriculture/+/+/unauthorized_device/config/#

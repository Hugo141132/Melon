# Eclipse Mosquitto Configuration for Kebun Melon Development Environment
# Authoritative Spec: docs/DEVICE_COMMUNICATION.md & SECURITY.md

# Listener on standard MQTT port 1883 across all network interfaces inside container
listener 1883 0.0.0.0

# Disable anonymous access (Mandatory Security Control)
allow_anonymous false

# Password and ACL configuration paths inside container
password_file /mosquitto/config/pwfile
acl_file /mosquitto/config/acl.conf

# Persistence & Logging configuration
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Connection limits & status reporting
max_connections -1
connection_messages true

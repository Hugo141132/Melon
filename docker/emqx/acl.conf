%% =============================================================================
%% Kebun Melon — Production EMQX v5 Access Control List (ACL) Configuration
%% File: docker/emqx/acl.conf
%% Governed by: docs/DEVICE_COMMUNICATION.md §8.4.7 & TASK-0907
%% =============================================================================
%%
%% This configuration defines the authoritative, least-privilege Access Control
%% List (ACL) policy enforced by the dedicated production EMQX Cloud cluster:
%%   Endpoint: he100b10.ala.asia-southeast1.emqxsl.com:8084 (WSS) / 8883 (MQTTS)
%%
%% Syntax: {allow | deny, Who, Action, TopicList}.
%% - Who: {username, "..."} | {clientid, "..."} | all
%% - Action: publish | subscribe | all
%% - TopicList: ["topic1", "topic2", ...]
%%
%% EMQX Cloud Dashboard Configuration Mapping:
%%   Navigate to: Access Control -> Authorization -> File / Built-in Database
%%   Ensure the policy evaluation order matches the rules below with Default Deny.
%% =============================================================================

%% -----------------------------------------------------------------------------
%% Rule 1: IoT Gateway Service
%% The backend IoT Gateway service mediates all telemetry ingestion and command
%% dispatches between the web platform, database, and reservoir hardware.
%% Granted full Publish/Subscribe access within the canonical irrigation namespace.
%% -----------------------------------------------------------------------------
{allow, {username, "Test_gateway"}, all, [
  "irigasi/melon/#"
]}.

%% -----------------------------------------------------------------------------
%% Rule 2: Physical Water Tank Hardware Node (ESP32 / NodeMCU)
%% Enforces strict least-privilege operational isolation:
%% - ALLOW PUBLISH: Water volume telemetry exclusively (irigasi/melon/sensor/volume).
%%   Hardware is STRICTLY FORBIDDEN from publishing commands or to any other topics.
%% - ALLOW SUBSCRIBE: Operational commands exclusively:
%%     1. Manual valve open/close commands (irigasi/melon/kontrol/valve)
%%     2. Automatic irrigation settings (irigasi/melon/setting/otomasi)
%%   Hardware is STRICTLY FORBIDDEN from subscribing to telemetry (#, sensor/#).
%% -----------------------------------------------------------------------------
{allow, {username, "Test_Device"}, publish, [
  "irigasi/melon/sensor/volume"
]}.

{allow, {username, "Test_Device"}, subscribe, [
  "irigasi/melon/kontrol/valve",
  "irigasi/melon/setting/otomasi"
]}.

%% -----------------------------------------------------------------------------
%% Rule 3: Default Deny Baseline
%% Any publish or subscribe request not explicitly matched by the rules above
%% must be immediately rejected fail-closed (returning MQTT 5.0 0x87 Not authorized).
%% Anonymous access is globally disabled at the authentication layer.
%% -----------------------------------------------------------------------------
{deny, all}.
